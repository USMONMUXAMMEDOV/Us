        body {
            background-color: #08070b;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;

        /* Golden & Neon Glowing Floating Bubble Icons */
        .ai-bubble {
            background: rgba(20, 18, 26, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.4s ease;
        }
        .ai-bubble:hover {
            border-color: #f59e0b;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
            transform: scale(1.15) translateY(-4px);
        }

        /* Glassmorphism Navigation & Cards */
        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
        }
        .glass-btn:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: rgba(245, 158, 11, 0.6);
            transform: translateY(-2px);
        }

        /* Canvas for Dynamic Glowing Background */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Floating animation for icons */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }
    </style>
</head>

    <!-- LOGIC & ANIMATION ENGINE -->
    <script>
        // AI TOOLS LIST WITH OFFICIAL LOGOS
        const aiList = [
            { name: "ChatGPT", logo: "https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg", size: "w-11 h-11" },
            { name: "Claude", logo: "https://cdn.worldvectorlogo.com/logos/claude-1.svg", size: "w-10 h-10" },
            { name: "Midjourney", logo: "https://upload.wikimedia.org/wikipedia/commons/e/e6/Midjourney_Emblem.png", size: "w-9 h-9" },
            { name: "n8n", logo: "https://n8n.io/favicon.ico", size: "w-8 h-8" },
            { name: "v0", logo: "https://v0.dev/assets/icon.png", size: "w-9 h-9" },
            { name: "Cursor", logo: "https://www.cursor.com/favicon.ico", size: "w-8 h-8" },
            { name: "Flux", logo: "https://blackforestlabs.ai/wp-content/uploads/2024/08/cropped-favicon-32x32.png", size: "w-8 h-8" },
            { name: "GitHub", logo: "https://github.githubassets.com/assets/pull-sharp-18e47db26a11.svg", size: "w-10 h-10" },
            { name: "Gemini", logo: "https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg", size: "w-10 h-10" },
            { name: "Perplexity", logo: "https://www.perplexity.ai/favicon.ico", size: "w-8 h-8" },
            { name: "ElevenLabs", logo: "https://elevenlabs.io/favicon.ico", size: "w-8 h-8" },
            { name: "Runway", logo: "https://runwayml.com/favicon.ico", size: "w-9 h-9" }
        ];

        // RENDER FLOATING AI BUBBLES
        const cloud = document.getElementById('aiCloud');
        aiList.forEach((item, idx) => {
            const delay = (idx % 4) * 0.5;
            cloud.innerHTML += `
                <div class="ai-bubble ${item.size} rounded-full flex items-center justify-center p-2 cursor-pointer animate-float" style="animation-delay: ${delay}s">
                    <img src="${item.logo}" alt="${item.name}" class="w-full h-full object-contain filter drop-shadow" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2103/2103832.png';">
                </div>
            `;
        });

        // BACKGROUND ANIMATION: MOVING GOLDEN & NEON NEURAL NETWORK
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Particle nodes
        const points = [];
        const numPoints = 45;

        for (let i = 0; i < numPoints; i++) {
            points.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.8,
                vy: (Math.random() - 0.5) * 0.8,
                radius: Math.random() * 2.5 + 1.5,
                color: Math.random() > 0.4 ? 'rgba(245, 158, 11, ' : 'rgba(56, 189, 248, '
            });
        }

        function drawBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Move and draw nodes
            for (let i = 0; i < points.length; i++) {
                let p = points[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                // Draw glowing dots
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color + '0.8)';
                ctx.shadowColor = p.color + '1)';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Connect nearest nodes with glowing lines
                for (let j = i + 1; j < points.length; j++) {
                    let p2 = points[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);

                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        let alpha = (1 - dist / 130) * 0.35;
                        ctx.strokeStyle = p.color + alpha + ')';
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawBackground);
        }
        drawBackground();
    </script>
