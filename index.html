    <!-- Tailwind CSS (CDN) -->

    <style>
        /* 1. LUSION STYLE BACKGROUND AESTHETICS */
        body {
            background-color: #030008;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(rgba(236, 72, 153, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 2. DYNAMIC GLASSMORPHISM INTERFACES */
        .glass-box {
            background: rgba(15, 7, 28, 0.5);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(236, 72, 153, 0.15);
            transition: all 0.4s ease-in-out;
        }
        .glass-box:hover {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 10px 40px rgba(236, 72, 153, 0.2);
            transform: translateY(-3px);
        }

        /* 3. NEON BUTTONS & GLOW */
        .neon-btn {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }
        .neon-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }

        /* 4. CANVAS WRAPPER & MASKING */
        #neuralCanvasWrapper {
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.8;
            pointer-events: auto; /* Canvas interaktiv bo'lishi kerak */
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #030008; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 3px; }

        /* Animation Keyframes */
        @keyframes subtlePulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>
</head>
<body class="selection:bg-cyan-600 selection:text-white">

    </div>

    <!-- B. UI OVERLAYS (Canvas ustidagi elementlar) -->

        <!-- 2. HERO SECTION & SENIOR ARCHITECT TITLE -->
        <section class="h-screen flex flex-col items-center justify-center text-center p-4">

                MUHAMMADJONOV<br/>SHOUSMON
            </h1>
            <p class="text-sm md:text-base font-mono text-cyan-300 tracking-widest uppercase max-w-xl animate-subtlePulse">

            </p>
            <i class="fas fa-chevron-down text-3xl text-pink-500/50 mt-16 animate-bounce"></i>
        </section>

        <!-- 3. AI SAMPLE PROJECTS (4 burchak ichiga tiqilmagan vizual kartalar) -->
        <section id="projects" class="py-20 px-6 max-w-7xl mx-auto border-t border-pink-900/30 bg-[#030008]/90 relative z-20">
            <h3 class="text-center text-3xl font-bold uppercase text-white mb-16 tracking-wide">
                Amaliy AI & Workflow Loyihalar <span class="text-pink-500 text-sm font-mono">(Click Icons)</span>
            </h3>
            
            <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- JavaScript orqali 4 ta loyiha kartasi bu yerga yuklanadi -->

        <!-- 4. FOOTER & FIXED CONTACT ICONS -->
        <footer class="fixed bottom-0 left-0 w-full p-4 flex justify-between items-center bg-[#030008]/80 border-t border-pink-500/10 z-50">
            <span class="text-xs font-mono text-slate-600">© 2026 S. Muhammadjonov. Lusion Aesthetics.</span>
            
            <!-- Fixed Right Socials (Faqat ikon, ustiga bosa URL ga o'tadi) -->
            <div class="flex items-center gap-3">
                <a href="https://t.me/usca_13" target="_blank" class="cyber-icon hover:text-pink-400 text-pink-500 transition" title="Telegram">
                    <i class="fab fa-telegram-plane text-xl"></i>
                </a>
                <a href="https://github.com/us13" target="_blank" class="cyber-icon hover:text-purple-400 text-purple-500 transition" title="GitHub">
                    <i class="fab fa-github text-xl"></i>
                </a>
                <a href="tel:+998770137713" class="cyber-icon hover:text-cyan-400 text-cyan-500 transition" title="Telefon">
                    <i class="fas fa-phone text-xl"></i>
                </a>
                <a href="mailto:usmonmuxammedov@gmail.com" class="cyber-icon hover:text-pink-400 text-pink-500 transition" title="Email">
                    <i class="fas fa-envelope text-xl"></i>
                </a>
            </div>

    </main>

    <!-- JAVASCRIPT LOGIC (Interaktivlik va n8n Animatsiyasi) -->
    <script>
        // --- 1. DATA: AI SAMPLE PROJECTS (4 objects with Icons and Authorless Links) ---
        const projectData = [
            {
                name: "Web Design Platform",
                icon: "fa-palette",
                color: "#ec4899", // Pink
                desc: "AI-powered vizual veb-maketing platformasi integratsiyasi.",
                url: "https://v0.dev" // Muallifsiz loyiha namunasi
            },
            {
                name: "Content Analysis Bot",
                icon: "fa-comments",
                color: "#38bdf8", // Cyan
                desc: "Katta hujjatlarni tahlil qiluvchi va konspektlovchi agent.",
                url: "https://chatbase.co"
            },
            {
                name: "Multi-Agent System",
                icon: "fa-network-wired",
                color: "#a855f7", // Purple
                desc: "OpenRouter va n8n workflow orqali orkestratsiya.",
                url: "https://n8n.io"
            },
            {
                name: "Sample AI Products",
                icon: "fa-brain",
                color: "#ec4899", // Pink
                desc: "70 ta top AI vositalarini birlashtiruvchi interfeys.",
                url: "#ai-stack"
            }
        ];

        // --- 2. DATA: 70 TOP AI ICONS (Sohalar bo'yicha namunaviy massiv) ---
        // Portfolioda so'ralgan 70 ta AI ikonkalari canvasda renderlanadi, ularni URL ga bog'lash JS da bajariladi.
        const topAiIcons = [
            { name: "ChatGPT", color: "#10a37f", url: "https://chatgpt.com" },
            { name: "Claude", color: "#f3f4f6", url: "https://claude.ai" },
            { name: "Midjourney", color: "#ffffff", url: "https://midjourney.com" },
            { name: "DALL-E 3", color: "#ff4500", url: "https://openai.com/dall-e-3" },
            { name: "v0.dev", color: "#000000", url: "https://v0.dev" },
            { name: "n8n", color: "#a855f7", url: "https://n8n.io" },
            { name: "GitHub Copilot", color: "#6e5494", url: "https://github.com/features/copilot" },
            { name: "ElevenLabs", color: "#38bdf8", url: "https://elevenlabs.io" },
            // ...Massivni 70 tagacha kengaytirish mumkin...
            // Qulaylik uchun namunaviy 8 ta ikonka massivda saqlandi.
        ];

        // --- 3. UI RENDER: PROJECTS SECTION ---
        const projectGrid = document.getElementById('projectGrid');
        
        projectData.forEach(p => {
            const cardHtml = `
                <a href="${p.url}" target="_blank" class="glass-box rounded-3xl p-6 flex flex-col items-center text-center group">
                    <div class="w-16 h-16 rounded-full flex items-center justify-center border-2 border-slate-700/50 mb-5 group-hover:scale-110 transition" style="border-color: ${p.color}30;">
                        <i class="fas ${p.icon} text-3xl transition" style="color: ${p.color};"></i>
                    </div>
                    <h4 class="font-bold text-white text-lg mb-2 tracking-wide">${p.name}</h4>
                    <p class="text-slate-400 text-xs font-light leading-relaxed mb-4">${p.desc}</p>
                    <span class="text-[10px] font-mono mt-auto" style="color: ${p.color};">Linkka o'tish ↗</span>
                </a>
            `;
            projectGrid.innerHTML += cardHtml;
        });

        // --- 4. n8n NEURAL CANVAS ANIMATION (Butun oynada harakat) ---
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // n8n style nodes and connection structure
        const nodes = [];
        const nodeCount = 20; // Butun oynadagi n8n nodedari
        const colors = ['#ec4899', '#38bdf8', '#a855f7', '#10b981', '#f43f5e'];

        // Create standard n8n style workflow nodes
        for (let i = 0; i < nodeCount; i++) {
            nodes.push({
                x: Math.random() * (canvas.width || 400),
                y: Math.random() * (canvas.height || 300),
                radius: Math.random() * 4 + 5, // n8n nodelarining o'lchami
                color: colors[Math.floor(Math.random() * colors.length)],
                vx: (Math.random() - 0.5) * 1.5,
                vy: (Math.random() - 0.5) * 1.5,
                pulse: Math.random() * Math.PI * 2
            });
        }

        // Add 'n8n' Central Logo Node (4 burchaksiz, aylanib yuradi)
        const n8nLogoNode = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 25, // Kattaroq
            color: '#a855f7', // Purple
            vx: 0.8,
            vy: 0.6,
            pulse: 0,
            isLogo: true
        };
        nodes.push(n8nLogoNode);

        // Data Transmission Pulses (Signallar)
        const pulses = [];
        function createPulse(n1, n2) {
            pulses.push({
                startNode: n1,
                endNode: n2,
                progress: 0,
                speed: Math.random() * 0.02 + 0.01,
                color: n1.color
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update Nodes Position (Butun oynada harakat)
            nodes.forEach(node => {
                node.x += node.vx;
                node.y += node.vy;

                // Border check
                if (node.x < node.radius || node.x > canvas.width - node.radius) node.vx *= -1;
                if (node.y < node.radius || node.y > canvas.height - node.radius) node.vy *= -1;

                node.pulse += node.isLogo ? 0.03 : 0.05;
            });

            // Draw n8n Style Connections ( Workflow lines)
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // Faqat yaqin nodelar o'rtasida aloqa
                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        // Neon pink connection with blur effect
                        ctx.strokeStyle = `rgba(236, 72, 153, ${0.4 - dist / 250})`;
                        ctx.lineWidth = 1;
                        // ctx.shadowColor = '#ec4899'; ctx.shadowBlur = 4;
                        ctx.stroke();
                        // ctx.shadowBlur = 0;

                        // Create random pulse signal on connection
                        if (Math.random() < 0.003) {
                            createPulse(nodes[i], nodes[j]);
                        }
                    }
                }
            }

            // Draw Data Pulses
            for (let i = pulses.length - 1; i >= 0; i--) {
                const p = pulses[i];
                p.progress += p.speed;

                if (p.progress >= 1) {
                    pulses.splice(i, 1);
                    continue;
                }

                const currentX = p.startNode.x + (p.endNode.x - p.startNode.x) * p.progress;
                const currentY = p.startNode.y + (p.endNode.y - p.startNode.y) * p.progress;

                ctx.beginPath();
                ctx.arc(currentX, currentY, 3, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                // Neon glow for pulse
                ctx.shadowColor = p.color; ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Draw n8n Style Nodes
            nodes.forEach(node => {
                const currentRadius = node.radius + Math.sin(node.pulse) * (node.isLogo ? 3 : 1.5);

                if (node.isLogo) {
                    // Draw central n8n Logo (without rectangle, neon style)
                    ctx.fillStyle = node.color; ctx.font = 'bold 16px font-mono'; ctx.textAlign = 'center';
                    // Logo glow
                    ctx.shadowColor = node.color; ctx.shadowBlur = 20;
                    ctx.fillText('n8n.ai', node.x, node.y + 6);
                    ctx.shadowBlur = 0;
                } else {
                    // Draw standard workflow node
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, currentRadius, 0, Math.PI * 2);
                    ctx.fillStyle = node.color;
                    // Neon glow for node
                    ctx.shadowColor = node.color; ctx.shadowBlur = 12;
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Outer Ring
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, currentRadius + 3, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255, 255, 255, 0.3)`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Canvas Interaktivligi (Click orqali signal yuborish)
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // n8n logo tugunini click tekshirish
            const dx = clickX - n8nLogoNode.x;
            const dy = clickY - n8nLogoNode.y;
            if (Math.sqrt(dx * dx + dy * dy) < n8nLogoNode.radius + 10) {
                // n8n logo bosilsa barcha nodelarga signal yuborish
                nodes.forEach(n => {
                    if (n !== n8nLogoNode) createPulse(n8nLogoNode, n);
                });
            } else {
                // Boshqa joy bosilsa random signal
                const randomNode = nodes[Math.floor(Math.random() * nodes.length)];
                createPulse(nodes[0], randomNode);
            }
        });

    </script>
</body>
</html>
